name: Raspberry Pi veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: pi-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Geprüftes Paket laden
        run: |
          curl --fail --location --retry 3 'https://htlnet.lovable.app/__l5e/assets-v1/996cfe09-e6c2-411b-9a8b-1478b85c01e1/htlnet-raspberry-pi.tar.gz' -o htlnet-raspberry-pi.tar.gz
          echo 'bee78e100c374d0bdc775be7d6108dee03907efd582a184b8f90f33cf995a350  htlnet-raspberry-pi.tar.gz' | sha256sum -c -
          mkdir package
          tar -xzf htlnet-raspberry-pi.tar.gz -C package
      - name: Schutzregeln prüfen
        run: |
          python -m pip install -r package/requirements.txt
          python -m unittest discover -s package -p 'test_*.py'
      - name: Öffentliches Downloadpaket bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.1 >/dev/null 2>&1 || gh release create v2.0.1 --title 'HTLNet Raspberry Pi 2.0.1' --notes 'Aruba REST: Status, LLDP, PoE und geschützte lokale Portsteuerung. Port 8090; täglicher Online-Abgleich um 06:00 Europe/Vienna. Vor-Ort-Test erforderlich; Windows unverändert. Zugangsdaten bleiben ausschließlich auf dem Pi. Anleitung im Paket.'
          gh release upload v2.0.1 htlnet-raspberry-pi.tar.gz --clobber
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: package
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/wolfmayr72/htlnet-raspberry-pi:2.0.1
            ghcr.io/wolfmayr72/htlnet-raspberry-pi:latest
          labels: |
            org.opencontainers.image.source=https://github.com/wolfmayr72/htlnet-raspberry-pi
            org.opencontainers.image.description=HTLNet local operations for Raspberry Pi
