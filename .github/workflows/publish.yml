name: Raspberry Pi veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: pi-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Geprüftes Paket laden
        run: |
          curl --fail --location --retry 3 'https://htlnet.lovable.app/__l5e/assets-v1/e0466bb4-ac6d-4f85-a934-2e91702a4cfb/htlnet-raspberry-pi.tar.gz' -o htlnet-raspberry-pi.tar.gz
          echo '9cc9c0866453008208e3d89b37bee0c18019025f88ff63f70c6aa08e144581b8  htlnet-raspberry-pi.tar.gz' | sha256sum -c -
          mkdir package
          tar -xzf htlnet-raspberry-pi.tar.gz -C package
      - name: Öffentliches Downloadpaket bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title 'HTLNet Raspberry Pi 1.0.0' --notes 'Port 8090; lokale Switch-Abfragen und täglicher Online-Abgleich um 06:00 Europe/Vienna. Zugangsdaten bleiben ausschließlich auf dem Pi. Anleitung im Paket.'
          gh release upload v1.0.0 htlnet-raspberry-pi.tar.gz --clobber
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: package
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/wolfmayr72/htlnet-raspberry-pi:1.0.0
            ghcr.io/wolfmayr72/htlnet-raspberry-pi:latest
          labels: |
            org.opencontainers.image.source=https://github.com/wolfmayr72/htlnet-raspberry-pi
            org.opencontainers.image.description=HTLNet local operations for Raspberry Pi
